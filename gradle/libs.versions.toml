[versions]
# Pinned to a specific snapshot build: an unpinned -SNAPSHOT turns any upstream publish into a
# red CI run on a repository nobody touched.
velocity = "4.0.0"
paper = "1.21.8-R0.1-20250906.215025-55"
luckperms = "5.5"
gson = "2.11.0"
annotations = "26.0.2"
caffeine = "3.2.0"
configurate = "4.2.0"
jedis = "7.5.3"
slf4j = "2.0.17"
adventure = "5.2.0"
junit = "5.11.4"
assertj = "3.27.0"
mockito = "5.23.0"
shadow = "9.0.0"

[libraries]
bytebuddy = { module = "net.bytebuddy:byte-buddy", version = "1.18.11" }
bytebuddy-agent = { module = "net.bytebuddy:byte-buddy-agent", version = "1.18.11" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
