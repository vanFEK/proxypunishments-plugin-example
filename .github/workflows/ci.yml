name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: modules/*/build/reports/tests/test
          retention-days: 7

      - name: Upload plugin jars
        uses: actions/upload-artifact@v7
        with:
          name: ProxyPunishments
          path: |
            modules/velocity/build/libs/ProxyPunishments-*.jar
            modules/paper/build/libs/ProxyPunishments-Paper-*.jar
          retention-days: 7
