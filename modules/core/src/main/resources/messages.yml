  banned-permanent: |-
    <gray>[<gradient:#ff8a00:#e52e71>ProxyBans</gradient><gray>]</gray> <red>Игрок <white><player></white> заблокирован навсегда.</red>
    <gray>Причина:</gray> <white><reason></white>
    <gray>Кто выдал:</gray> <white><admin></white>
    <gray>Когда:</gray> <white><issued_at></white>
  banned-temporary: |-
    <gray>[<gradient:#ff8a00:#e52e71>ProxyBans</gradient><gray>]</gray> <red>Игрок <white><player></white> заблокирован временно.</red>
    <gray>Причина:</gray> <white><reason></white>
    <gray>Кто выдал:</gray> <white><admin></white>
    <gray>Когда:</gray> <white><issued_at></white>
    <gray>Осталось:</gray> <yellow><remaining></yellow>
    <gray>Истекает:</gray> <yellow><expires_at></yellow>

history:
