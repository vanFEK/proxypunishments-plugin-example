  header: "<gray>[<gradient:#ff8a00:#e52e71>ProxyBans</gradient><gray>]</gray> <gray>История наказаний <white><player></white>, страница <yellow><page></yellow>:</gray>"
  entry: "<dark_gray>›</dark_gray> <yellow><action></yellow> <gray>от</gray> <white><admin></white> <dark_gray>—</dark_gray> <white><reason></white> <dark_gray>(<at>)</dark_gray>"

