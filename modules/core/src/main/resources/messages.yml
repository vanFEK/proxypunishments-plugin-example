  tempban-requires-duration: "<gray>[<gradient:#ff8a00:#e52e71>ProxyBans</gradient><gray>]</gray> <red>Для /tempban нужна конечная длительность. Для вечного бана используйте /ban.</red>"
  reason-required: "<gray>[<gradient:#ff8a00:#e52e71>ProxyBans</gradient><gray>]</gray> <red>Укажите причину блокировки.</red>"
  unknown-player: "<gray>[<gradient:#ff8a00:#e52e71>ProxyBans</gradient><gray>]</gray> <red>Игрок <white><player></white> неизвестен сервису.</red>"
  service-down: "<gray>[<gradient:#ff8a00:#e52e71>ProxyBans</gradient><gray>]</gray> <red>Сервис блокировок недоступен. Подробности в консоли.</red>"
  service-status: "<gray>[<gradient:#ff8a00:#e52e71>ProxyBans</gradient><gray>]</gray> <red>Сервис блокировок ответил ошибкой <white><status></white>. Подробности в консоли.</red>"
  degraded: "<gray>[<gradient:#ff8a00:#e52e71>ProxyBans</gradient><gray>]</gray> <red>Плагин не смог загрузить конфигурацию и работает в аварийном режиме.</red>"
