  empty: "<gray>[<gradient:#ff8a00:#e52e71>ProxyBans</gradient><gray>]</gray> <gray>Активных блокировок нет.</gray>"
  header: "<gray>[<gradient:#ff8a00:#e52e71>ProxyBans</gradient><gray>]</gray> <gray>Активные блокировки, страница <yellow><page></yellow>:</gray>"
  entry-permanent: "<dark_gray>›</dark_gray> <white><player></white> <dark_gray>—</dark_gray> <red>навсегда</red> <dark_gray>—</dark_gray> <white><reason></white> <gray>(<admin>)</gray>"
