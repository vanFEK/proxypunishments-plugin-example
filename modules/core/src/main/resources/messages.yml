# All strings are MiniMessage templates: https://docs.advntr.dev/minimessage/format.html
# Placeholders are inserted verbatim and are never parsed as MiniMessage, so a player cannot
# smuggle formatting into staff messages through their name or a ban reason.

prefix: "<gray>[<gradient:#ff8a00:#e52e71>ProxyBans</gradient><gray>]</gray> "

login:
  kick-permanent: |-
    <red><bold>Вы заблокированы навсегда</bold></red>

    <gray>Причина:</gray> <white><reason></white>
    <gray>Кто выдал:</gray> <white><admin></white>
  kick-temporary: |-
    <red><bold>Вы временно заблокированы</bold></red>

    <gray>Причина:</gray> <white><reason></white>
    <gray>Кто выдал:</gray> <white><admin></white>
    <gray>Осталось:</gray> <yellow><remaining></yellow>
    <gray>Истекает:</gray> <yellow><expires_at></yellow>
  service-unavailable: |-
    <red>Сервис блокировок недоступен.</red>
    <gray>Попробуйте зайти позже.</gray>

ban:
  success-permanent: "<gray>[<gradient:#ff8a00:#e52e71>ProxyBans</gradient><gray>]</gray> <green>Игрок <white><player></white> заблокирован навсегда.</green> <gray>Причина:</gray> <white><reason></white>"
  success-temporary: "<gray>[<gradient:#ff8a00:#e52e71>ProxyBans</gradient><gray>]</gray> <green>Игрок <white><player></white> заблокирован на <yellow><duration></yellow>.</green> <gray>Причина:</gray> <white><reason></white>"

unban:
  success: "<gray>[<gradient:#ff8a00:#e52e71>ProxyBans</gradient><gray>]</gray> <green>Блокировка с игрока <white><player></white> снята.</green> <gray>Причина:</gray> <white><reason></white>"

