    <gray>[<gradient:#ff8a00:#e52e71>ProxyBans</gradient><gray>]</gray> <gray>Доступные команды:</gray>
    <dark_gray>›</dark_gray> <white>/pb ban <player> [длительность] <причина></white>
    <dark_gray>›</dark_gray> <white>/pb tempban <player> <длительность> <причина></white>
    <dark_gray>›</dark_gray> <white>/pb unban <player> [причина]</white>
    <dark_gray>›</dark_gray> <white>/pb info <player></white>
    <dark_gray>›</dark_gray> <white>/pb history <player> [страница]</white>
    <dark_gray>›</dark_gray> <white>/pb list [страница]</white>
    <gray>Длительность: <white>1d</white>, <white>2h30m</white>, <white>3M</white>, <white>perm</white></gray>

