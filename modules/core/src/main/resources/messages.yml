kick:
  not-online: "<gray>[<gradient:#ff8a00:#e52e71>ProxyBans</gradient><gray>]</gray> <red>Игрок <white><target></white> не в сети.</red>"
  player-reason: |-
    <red><bold>Вы были отключены</bold></red>

    <gray>Причина:</gray> <white><reason></white>
