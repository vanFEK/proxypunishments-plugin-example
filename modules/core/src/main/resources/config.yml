# ProxyPunishments — plugin configuration, shared by the Velocity and the Paper module.
# Durations use ISO-8601 notation: PT2S = 2 seconds, PT30M = 30 minutes.

service:
  # Where proxypunishments-service listens. Inside Docker this is the service name, not localhost.
  base-url: "http://proxypunishments:8080"
  # Must match PROXYPUNISHMENTS_SERVICE_TOKEN on the service. An empty token is rejected on both sides.
  token: ""
  connect-timeout: PT2S
  request-timeout: PT3S

cache:
  # How long a fresh answer is served without asking the service again.
  active-ttl: PT30S
  # How long a stale answer may still be used while the service is unreachable.
  stale-ttl: PT30M
  max-size: 100000

login:
  # Service unreachable and no usable cached answer: true lets the player in, false rejects them.
  fail-open: true
  # Report UUID <-> name to the service on login. Only useful in 'local' mode.
  remember-player: true

# Paper module only: the proxy cannot intercept signed chat, so mutes are enforced on the backend server.
chat:
  # Cancel chat and the commands below for muted players.
  enforce-mute: true
  # Service unreachable and no usable cached answer: true lets the message through, false blocks it.
  fail-open: true
  # Commands that count as chat. A namespace prefix such as 'essentials:msg' is ignored when matching.
  blocked-commands: ["msg", "tell", "w", "whisper", "r", "reply", "me", "say", "pm"]

commands:
  # Register /ban, /tempban, /unban... as top-level commands in addition to /pp <subcommand>.
  register-top-level-aliases: true
  # Paper module only. auto: register nothing when the server sits behind a BungeeCord or Velocity
  # proxy, because the proxy owns the commands, and everything on a standalone server.
  # always / never override the detection.
  mode: auto
